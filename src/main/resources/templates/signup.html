<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign up</title>

    <!-- Minimal styles so it looks decent out of the box -->
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background: #f6f8fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            max-width: 520px;
            width: 100%;
            padding: 28px;
        }
        h1 { margin: 0 0 12px 0; font-size: 20px; }
        p.lead { margin: 0 0 18px 0; color: #444; }

        .form-row {
            display: flex;
            gap: 12px;
        }
        .form-group {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
        }
        label { font-size: 13px; margin-bottom: 6px; color: #333; }
        input[type="text"], input[type="email"], input[type="password"], input[type="tel"] {
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #d9dbe0;
            font-size: 14px;
            outline: none;
        }
        input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus, input[type="tel"]:focus {
            border-color: #5b8def;
            box-shadow: 0 0 0 3px rgba(91,141,239,0.12);
        }
        .error {
            color: #b00020;
            font-size: 12px;
            margin-top: 6px;
        }
        .actions {
            display:flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 18px;
        }
        button {
            background: #2563eb;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        .alt-link {
            font-size: 13px;
            color: #555;
        }
        .alt-link a { color: #2563eb; text-decoration: none; }
        @media (max-width:480px) {
            .form-row { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Create an account</h1>
    <p class="lead">Sign up to get access. We'll never share your info.</p>

    <!--
      Binding: th:object="${user}"
      Controller should add: model.addAttribute("user", new User());
      POST target: /signup (adjust if your endpoint differs)
    -->
    <form th:action="@{/signup}" method="post" th:object="${user}">
        <!-- CSRF token -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="form-row">
            <div class="form-group" style="flex:1">
                <label for="firstName">First name</label>
                <input id="firstName" type="text" th:field="*{firstName}" placeholder="Jane" />
                <div class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
            </div>

            <div class="form-group" style="flex:1">
                <label for="lastName">Last name</label>
                <input id="lastName" type="text" th:field="*{lastName}" placeholder="Doe" />
                <div class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
            </div>
        </div>

        <div class="form-group">
            <label for="username">Username</label>
            <input id="username" type="text" th:field="*{username}" placeholder="choose a username" />
            <div class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}" placeholder="you@example.com" />
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="form-group">
            <label for="phoneNumber">Phone number</label>
            <input id="phoneNumber" type="tel" th:field="*{phoneNumber}" placeholder="+2348012345678" />
            <div class="error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" th:field="*{password}" placeholder="Create a password" />
            <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <!-- optional: add password confirmation if you want -->
        <div class="actions">
            <div class="alt-link">
                Already have an account? <a th:href="@{/login}">Log in</a>
            </div>
            <button type="submit">Sign up</button>
        </div>
    </form>
</div>
</body>
</html>
