spring.application.name=PumpWatch-Backend

# PostgreSQL database configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/pumpwatchdb
spring.datasource.username=pumpy
spring.datasource.password=chukwunaza123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.output.ansi.enabled=always

# JPA configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database=postgresql
security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-expiration-minutes=15
security.jwt.refresh-token-expiration-days=14

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-response=true
server.address=0.0.0.0